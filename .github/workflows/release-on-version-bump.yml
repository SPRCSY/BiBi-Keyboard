name: Release on Version Bump

on:
  push:
    branches: ["main", "master"]
    paths:
      - "app/build.gradle"
      - "app/build.gradle.kts"
      - "gradle.properties"
      - "app/src/main/AndroidManifest.xml"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a public GitHub Release and update version.json (off = APK artifacts only)"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整历史以便检测版本变化

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2
        continue-on-error: true
        timeout-minutes: 2

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Detect version change
        id: version
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          FORCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess

          def read_file(path):
              try:
                  with open(path, 'r', encoding='utf-8') as f:
                      return f.read()
              except FileNotFoundError:
                  return None

          def parse_versions(text):
              if not text:
                  return None, None
              vn = None
              vc = None
              m = re.search(r'versionName\s*[= ]\s*"?([0-9A-Za-z\.-_\+]+)"?', text)
              if m:
                  vn = m.group(1)
              m = re.search(r'versionCode\s*[= ]\s*"?([0-9]+)"?', text)
              if m:
                  vc = m.group(1)
              if vn is None:
                  m = re.search(r'(?im)^\s*(?:VERSION_NAME|versionName)\s*=\s*([^\s#]+)', text)
                  if m:
                      vn = m.group(1).strip()
              if vc is None:
                  m = re.search(r'(?im)^\s*(?:VERSION_CODE|versionCode)\s*=\s*([0-9]+)', text)
                  if m:
                      vc = m.group(1).strip()
              if vn is None:
                  m = re.search(r'android:versionName\s*=\s*"([^"]+)"', text)
                  if m:
                      vn = m.group(1)
              if vc is None:
                  m = re.search(r'android:versionCode\s*=\s*"([^"]+)"', text)
                  if m:
                      vc = m.group(1)
              return vn, vc

          def get_file_at_rev(path, rev=None):
              if rev is None:
                  return read_file(path)
              try:
                  out = subprocess.check_output(['git', 'show', f'{rev}:{path}'], stderr=subprocess.STDOUT)
                  return out.decode('utf-8', errors='ignore')
              except subprocess.CalledProcessError:
                  return None

          paths = ['app/build.gradle', 'app/build.gradle.kts', 'gradle.properties', 'app/src/main/AndroidManifest.xml']

          text_head = None
          for p in paths:
              content = get_file_at_rev(p, None)
              if content:
                  text_head = content
                  break
          vn_head, vc_head = parse_versions(text_head)

          prev_rev = os.environ.get('GITHUB_EVENT_BEFORE') or 'HEAD^'
          text_prev = None
          for p in paths:
              content = get_file_at_rev(p, prev_rev)
              if content:
                  text_prev = content
                  break
          vn_prev, vc_prev = parse_versions(text_prev)

          # Push builds require a versionCode change; manual builds always run.
          changed = False
          if vc_head and (vc_head != (vc_prev or '')):
              changed = True
          if os.environ.get('FORCE_RELEASE', '').lower() == 'true':
              changed = True

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'version_name={vn_head or ""}\n')
              f.write(f'version_code={vc_head or ""}\n')
              f.write(f'prev_version_name={vn_prev or ""}\n')
              f.write(f'prev_version_code={vc_prev or ""}\n')
              f.write(f'changed={"true" if changed else "false"}\n')
          PY

      - name: Check if version changed
        if: steps.version.outputs.changed != 'true'
        run: |
          echo "::notice::versionCode 未变化 (当前: ${{ steps.version.outputs.version_code }}),跳过构建和发布流程"
          echo "ℹ️ versionCode 未变化,跳过 release"
          echo "📌 当前版本: ${{ steps.version.outputs.version_name }} (versionCode: ${{ steps.version.outputs.version_code }})"
          echo "📌 上一版本: ${{ steps.version.outputs.prev_version_name }} (versionCode: ${{ steps.version.outputs.prev_version_code }})"
          echo "💡 提示: 只有当 versionCode 发生变化时才会触发构建和发布"

      - name: Compose current tag
        if: steps.version.outputs.changed == 'true'
        id: tag
        run: |
          V="$VERSION_NAME"
          if [ -z "$V" ]; then V="$VERSION_CODE"; fi
          if [ -z "$V" ]; then V="$(date +%Y%m%d)-${{ github.sha }}"; fi
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "version_display=$V" >> "$GITHUB_OUTPUT"
          echo "当前 tag: v$V"
          if [ "$PUBLISH_RELEASE" = "true" ]; then
            EXISTING_SHA=$(git rev-list -n 1 "refs/tags/v$V" 2>/dev/null || true)
            if [ -n "$EXISTING_SHA" ] && [ "$EXISTING_SHA" != "$GITHUB_SHA" ]; then
              echo "::error::Tag v$V already exists on a different commit. Increase versionName and versionCode before publishing."
              exit 1
            fi
          fi
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          PUBLISH_RELEASE: ${{ github.event_name == 'push' || inputs.publish_release }}

      - name: Extract changelog from CHANGELOG.md
        if: steps.version.outputs.changed == 'true'
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version_name }}"
          CURRENT_TAG="${{ steps.tag.outputs.tag }}"

          echo "📖 从 CHANGELOG.md 提取版本 $VERSION 的更新内容..."

          # 使用 Python 提取 CHANGELOG.md 和 CHANGELOG_EN.md 中对应版本的内容
          python3 - <<'PY'
          import os
          import re

          version = os.environ.get('VERSION', '')
          current_tag = os.environ.get('CURRENT_TAG', '')

          def extract_version_notes(changelog_file, version):
              """从 CHANGELOG 文件中提取指定版本的更新内容"""
              try:
                  with open(changelog_file, 'r', encoding='utf-8') as f:
                      content = f.read()
              except FileNotFoundError:
                  print(f"⚠️ {changelog_file} 不存在")
                  return ""

              if not content or not version:
                  return ""

              # 匹配版本标题: ## vX.X.X (YYYY-MM-DD) 或 ## vX.X.X
              # 提取从当前版本标题到下一个 --- 或下一个版本标题之间的内容
              pattern = rf'(## v?{re.escape(version)}[^\n]*\n)(.*?)(?=\n---|\n## v|\Z)'
              match = re.search(pattern, content, re.DOTALL)

              if match:
                  return match.group(2).strip()
              return ""

          # 提取中文版更新内容
          release_notes = extract_version_notes('CHANGELOG.md', version)
          if release_notes:
              print(f"✅ 找到版本 {version} 的中文更新内容 ({len(release_notes)} 字符)")
          else:
              release_notes = f"版本 {version} 已发布"
              print(f"ℹ️ 使用默认中文更新说明")

          # 提取英文版更新内容
          release_notes_en = extract_version_notes('CHANGELOG_EN.md', version)
          if release_notes_en:
              print(f"✅ 找到版本 {version} 的英文更新内容 ({len(release_notes_en)} 字符)")
          else:
              release_notes_en = f"Version {version} released"
              print(f"ℹ️ 使用默认英文更新说明")

          # 写入 release_notes_short.txt（中文）供 version.json 使用
          with open('release_notes_short.txt', 'w', encoding='utf-8') as f:
              f.write(release_notes)

          # 写入 release_notes_en_short.txt（英文）供 version.json 使用
          with open('release_notes_en_short.txt', 'w', encoding='utf-8') as f:
              f.write(release_notes_en)

          # 生成 changelog.md 用于 GitHub Release（包含中英文）
          with open('changelog.md', 'w', encoding='utf-8') as f:
              f.write(f"## 📝 更新日志 / Changelog ({current_tag})\n\n")
              f.write("### 中文\n\n")
              f.write(release_notes)
              f.write("\n\n---\n\n")
              f.write("### English\n\n")
              f.write(release_notes_en)
              f.write("\n")

          print(f"✅ changelog.md、release_notes_short.txt、release_notes_en_short.txt 已生成")
          PY
        env:
          VERSION: ${{ steps.version.outputs.version_name }}
          CURRENT_TAG: ${{ steps.tag.outputs.tag }}

      - name: Set up Android SDK
        if: steps.version.outputs.changed == 'true'
        uses: android-actions/setup-android@v4
        with:
          # Google 已下架旧的 `tools` 包，不能再用 action 默认值 `tools platform-tools`
          packages: platform-tools

      - name: Validate signing secrets
        if: steps.version.outputs.changed == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Configure all four signing secrets. This workflow never substitutes a Debug APK."
            exit 1
          fi

      - name: Decode and validate keystore
        if: steps.version.outputs.changed == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bibi-release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/bibi-release.keystore" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null
          echo "KEYSTORE_FILE=$RUNNER_TEMP/bibi-release.keystore" >> "$GITHUB_ENV"

      - name: Prepare prebuilt QNN SM8750 runtime and model
        if: steps.version.outputs.changed == 'true'
        run: python3 .github/scripts/prepare_qnn_sm8750.py

      - name: Make Gradle wrapper executable
        if: steps.version.outputs.changed == 'true'
        run: |
          chmod +x ./gradlew || true
          sed -i -e 's/\r$//' ./gradlew || true

      - name: Check QNN audio windows and defaults
        if: steps.version.outputs.changed == 'true'
        run: |
          python3 .github/scripts/test_qnn_artifact_setup.py
          ./gradlew --no-daemon :app:testDebugUnitTest --tests '*QnnAudioWindowsTest' --tests '*QnnBuildDefaultsTest' -PabiFilters=arm64-v8a

      - name: Build Release APK with signing
        if: steps.version.outputs.changed == 'true'
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SF_FREE_API_KEY: ${{ secrets.SF_FREE_API_KEY }}
          POCKETBASE_BASE_URL: ${{ secrets.POCKETBASE_BASE_URL || vars.POCKETBASE_BASE_URL }}
          VERSION: ${{ steps.version.outputs.version_name }}
        run: |
          # APK 资产命名须与 app/.../ui/update/UpdateApkNaming.kt 首选项一致
          echo "使用签名密钥分 ABI 构建 Release APK..."
          mkdir -p release-artifacts
          for ABI in arm64-v8a; do
            echo "构建 ABI: $ABI"
            ./gradlew --no-daemon clean :app:assembleRelease -PabiFilters="$ABI"
            APK_PATH=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | grep -v unaligned | head -n 1 || true)
            if [ -z "$APK_PATH" ]; then
              echo "未找到 $ABI Release APK"
              exit 1
            fi
            NEW_PATH="release-artifacts/app-release-${VERSION}-${ABI}.apk"
            cp "$APK_PATH" "$NEW_PATH"
            ls -lh "$NEW_PATH"
          done

      - name: Locate built APKs
        if: steps.version.outputs.changed == 'true'
        id: locate_apks
        run: |
          APK_FILES=$(find release-artifacts -maxdepth 1 -type f -name "*.apk" | sort || true)
          if [ -z "$APK_FILES" ]; then
            echo "未找到 APK 文件"
            exit 1
          fi
          {
            echo "apk_paths<<EOF"
            echo "$APK_FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "找到 APK 文件:"
          ls -lh release-artifacts/*.apk

      - name: Verify APK signatures and checksums
        if: steps.version.outputs.changed == 'true'
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          for apk in release-artifacts/*.apk; do
            "$APKSIGNER" verify --verbose --print-certs "$apk"
          done
          (cd release-artifacts && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload signed Release APKs
        if: steps.version.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-${{ steps.version.outputs.version_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Create GitHub Release
        if: steps.version.outputs.changed == 'true' && (github.event_name == 'push' || inputs.publish_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          name: "Release ${{ steps.tag.outputs.version_display }}"
          body_path: changelog.md
          files: release-artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version.json
        if: steps.version.outputs.changed == 'true' && (github.event_name == 'push' || inputs.publish_release)
        id: update_version_json
        run: |
          echo "📝 更新 version.json 文件..."

          # 使用 Python 生成 JSON（确保格式正确）
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime

          version = os.environ.get('VERSION', '0.0.0')
          version_code = os.environ.get('VERSION_CODE', '0')
          tag = os.environ.get('TAG', 'v0.0.0')

          # 从之前提取的 release_notes_short.txt 读取（来源于 CHANGELOG.md）
          try:
              with open('release_notes_short.txt', 'r', encoding='utf-8') as f:
                  release_notes = f.read().strip()
          except FileNotFoundError:
              release_notes = f'版本 {version} 已发布'

          # 从之前提取的 release_notes_en_short.txt 读取（来源于 CHANGELOG_EN.md）
          try:
              with open('release_notes_en_short.txt', 'r', encoding='utf-8') as f:
                  release_notes_en = f.read().strip()
          except FileNotFoundError:
              release_notes_en = f'Version {version} released'

          # 使用 ISO 8601 格式的时间戳（UTC）
          current_timestamp = datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ')

          # 读取现有的 version.json（如果存在）
          try:
              with open('version.json', 'r', encoding='utf-8') as f:
                  data = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              data = {}

          # 更新版本信息
          data['version'] = version
          data['version_code'] = int(version_code) if version_code.isdigit() else 0
          data['download_url'] = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/tag/{tag}"
          data['release_notes'] = release_notes
          data['release_notes_en'] = release_notes_en
          data['min_supported_version'] = data.get('min_supported_version', '2.6.5')
          data['update_time'] = current_timestamp

          # 写入文件
          with open('version.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          print(f"✅ version.json 已更新为版本 {version}")
          PY

          # 显示更新后的内容
          echo "📄 version.json 内容:"
          cat version.json

          # 检查文件是否有变化
          if git diff --quiet version.json; then
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ version.json 无变化"
          else
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
            echo "✅ version.json 已更新"
          fi
        env:
          VERSION: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          TAG: ${{ steps.tag.outputs.tag }}

      - name: Commit and push version.json
        if: steps.version.outputs.changed == 'true' && (github.event_name == 'push' || inputs.publish_release) && steps.update_version_json.outputs.version_changed == 'true'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version_name }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add version.json
          git commit -m "chore: auto-update version.json to $VERSION [skip ci]"
          # Fast-forward only: fail if this branch advanced since the build.
          git push origin "HEAD:refs/heads/$BRANCH_NAME"

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/bibi-release.keystore"
